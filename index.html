<div id="alcivia-margin-game-wrap" style="width:100%;max-width:100%;margin:0 auto;">
  <iframe
    id="alcivia-margin-game"
    src="https://barra1ak.github.io/alcivia-margin-game/"
    title="ALCIVIA Margin Game"
    allow="fullscreen"
    allowfullscreen
    style="width:100%;height:1100px;border:0;display:block;overflow:auto;background:#eef1eb;"
  ></iframe>
</div>
<script>
(function(){
  const iframe=document.getElementById('alcivia-margin-game');
  const allowedOrigin='https://barra1ak.github.io';
  function valid(event){return event.origin===allowedOrigin&&event.source===iframe.contentWindow;}
  function requestMeasure(){iframe.contentWindow?.postMessage({type:'alcivia-request-height'},allowedOrigin);}
  window.addEventListener('message',async function(event){
    if(!valid(event))return;
    const data=event.data||{};
    if(data.type==='alcivia-simulator-height'&&document.fullscreenElement!==iframe){
      const newHeight=Math.max(420,Math.min(16000,Number(data.height)||0));
      iframe.style.height=newHeight+'px';
    }
    if(data.type==='alcivia-fullscreen-request'){
      try{if(iframe.requestFullscreen)await iframe.requestFullscreen();}
      catch(err){console.warn('Fullscreen unavailable',err);}
    }
    if(data.type==='alcivia-fullscreen-exit'){
      if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange',function(){
    const active=document.fullscreenElement===iframe;
    iframe.contentWindow?.postMessage({type:'alcivia-fullscreen-state',active:active},allowedOrigin);
    if(!active){setTimeout(requestMeasure,80);setTimeout(requestMeasure,300);}
  });
  iframe.addEventListener('load',()=>{requestMeasure();setTimeout(requestMeasure,300);});
})();
</script>
